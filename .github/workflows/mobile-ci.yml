name: Mobile CI — K Screens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        type: choice
        options: ['ios android', 'ios', 'android']
        default: 'ios'

# ── Cấu hình cho Self-hosted Runner (Mac) ────────
#
# Đảm bảo bạn đã cấu hình các thông tin sau trong file .env của Runner:
#   - ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_PATH, APPLE_TEAM_ID
#   - GOOGLE_PLAY_KEY_PATH
# Và đã cấu hình SSH Key truy cập repo chứng chỉ trực tiếp trên máy Mac.
#

permissions:
  contents: write

jobs:
  build:
    name: Build Mobile (${{ matrix.platform }})
    runs-on: self-hosted
    timeout-minutes: 60

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # - platform: ios
          - platform: android

    env:
      # ── mobile-ci config ────────────────────────────────────────────────────
      CAP_PLATFORMS: ${{ matrix.platform }}

      # (Lưu ý: Các credentials bảo mật như App Store Connect Key, 
      # Google Play Key đã được lưu trữ và nạp tự động từ .env của Self-hosted Runner)

      # ── CI flags ────────────────────────────────────────────────────────────
      CI: "true"
      SKIP_ASC_SETUP: "false"
      SKIP_BUILD: "false"
      SKIP_UPLOAD: "false"

    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1: Checkout source
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 2: Setup Node.js + pnpm (cả iOS lẫn Android đều cần)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 3: Install node dependencies
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📦 Install dependencies"
        run: pnpm install --no-frozen-lockfile

      - name: "📦 Install CocoaPods"
        if: matrix.platform == 'ios'
        run: gem install cocoapods -NV

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 6: Setup Android SDK (chỉ Android)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🤖 Setup Java"
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 7: Cài mobile-ci và thêm vào PATH
      # install.sh tự detect GITHUB_PATH và thêm vào
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🔧 Install mobile-ci"
        run: bash mobile-ci/install.sh

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 8: Chạy mobile-ci setup
      # Tự động: fix code → build web → add platform → cap sync → fastlane
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🚀 Run mobile-ci setup"
        run: mobile-ci setup

      # ── Lưu generated files để commit-job dùng ──────────────────────────
      - name: "💾 Upload generated files as artifact"
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ matrix.platform }}-${{ github.run_number }}
          # Chỉ upload những gì thực sự thay đổi
          path: |
            package.json
            pnpm-lock.yaml
            capacitor.config.json
            Gemfile
            Gemfile.lock
            android/
            ios/
            fastlane/
          if-no-files-found: ignore
          retention-days: 1

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 9: (iOS only) Chạy Fastlane CI pipeline
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🍎 Fastlane CI Pipeline"
        if: matrix.platform == 'ios'
        working-directory: ${{ github.workspace }}
        run: bundle exec fastlane ci_pipeline
        env:
          RELEASE_NOTES: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 10: (Android only) Build Release APK + AAB
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🤖 Build Android Release"
        if: matrix.platform == 'android'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 10.5: (Android only) Upload lên Google Play via Fastlane
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🚀 Upload Google Play"
        if: matrix.platform == 'android' && env.SKIP_UPLOAD != 'true'
        run: |
          echo "── Kiểm tra môi trường ──"
          which ruby && ruby --version
          which gem && gem --version
        
          source mobile.config.sh
          echo "GOOGLE_PLAY_KEY_PATH=$GOOGLE_PLAY_KEY_PATH"
          echo "APP_ID=$APP_ID"
          ls -lh android/app/build/outputs/bundle/release/ || echo "❌ Không tìm thấy AAB"

          echo ""
          echo "── Cài fastlane (nếu chưa có) ──"
          if ! command -v fastlane &>/dev/null; then
            sudo gem install fastlane -NV 2>&1
          else
            echo "✓ fastlane đã có: $(fastlane --version)"
          fi


          echo ""
          echo "── Upload Google Play ──"
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --json_key "$GOOGLE_PLAY_KEY_PATH" \
            --package_name "$APP_ID" \
            --track internal \
            --skip_upload_metadata \
            --skip_upload_changelogs \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_apk \
            --verbose 2>&1        # <-- stream toàn bộ log ra stdout

          echo "✅ Upload Google Play (internal) thành công!"

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 11: Upload build artifacts
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📤 Upload Android APK"
        if: matrix.platform == 'android' && always()
        uses: actions/upload-artifact@v4
        with:
          name: K-Screens-Android-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: "📤 Upload Android AAB"
        if: matrix.platform == 'android' && always()
        uses: actions/upload-artifact@v4
        with:
          name: K-Screens-Android-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  # JOB RIÊNG: Commit tất cả generated files SAU KHI cả 2 build job xong
  # Chạy 1 lần duy nhất → không bao giờ conflict
  # ══════════════════════════════════════════════════════════════════════════
  commit-generated:
    name: "📝 Commit generated files"
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: "📥 Checkout (bản mới nhất)"
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: "📥 Download iOS generated files"
        uses: actions/download-artifact@v4
        with:
          name: generated-ios-${{ github.run_number }}
          path: .
        continue-on-error: true   # iOS job có thể đã skip

      - name: "📥 Download Android generated files"
        uses: actions/download-artifact@v4
        with:
          name: generated-android-${{ github.run_number }}
          path: .
        continue-on-error: true   # Android job có thể đã skip

      - name: "💾 Commit & push"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for path in \
            package.json \
            pnpm-lock.yaml \
            android/ \
            ios/ \
            capacitor.config.json \
            fastlane/ \
            Gemfile \
            Gemfile.lock \
            .env.fastlane.example; do
            if [ -e "$path" ]; then
              git add -f "$path"
              echo "  ✓ Staged: $path"
            else
              echo "  ✗ Skip: $path"
            fi
          done

          echo "── Staged files ──"
          git diff --cached --stat || true

          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi cần commit"
            exit 0
          fi

          git commit -m "chore: auto-generate platform files [skip ci]"

          # Push với retry — job này chạy 1 lần duy nhất nên ít conflict hơn
          PUSHED=false
          for i in 1 2 3; do
            echo "⏳ Push attempt $i..."
            if git pull --rebase origin main && git push origin main; then
              PUSHED=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "⏳ Retry sau 10s..."
            sleep 10
          done

          if [ "$PUSHED" = false ]; then
            echo "❌ Push thất bại sau 3 lần retry"
            exit 1
          fi

          echo "✅ Đã commit và push thành công"

