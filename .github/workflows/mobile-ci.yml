name: Mobile CI — K Screens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        type: choice
        options: ['ios android', 'ios', 'android']
        default: 'ios android'
      skip_upload:
        description: 'Skip TestFlight upload'
        type: boolean
        default: true

# ── Secrets cần cấu hình (Settings → Secrets and variables → Actions) ────────
#
# BẮT BUỘC cho iOS signing + upload:
#   ASC_KEY_ID          — Key ID từ App Store Connect → Users → Keys
#   ASC_ISSUER_ID       — Issuer ID từ trang tạo key
#   ASC_PRIVATE_KEY_B64 — base64 -i AuthKey_XXX.p8 | tr -d '\n'
#   APPLE_TEAM_ID       — Team ID (10 ký tự) từ developer.apple.com
#
# TÙY CHỌN cho code signing (match):
#   MATCH_GIT_URL       — git@github.com:org/certs.git (SSH) hoặc HTTPS
#   MATCH_PASSWORD      — Mật khẩu encrypt match repo
#   MATCH_SSH_KEY       — SSH private key để clone match repo
#

permissions:
  contents: write

jobs:
  build:
    name: Build Mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS PHẢI chạy trên macOS (Xcode bắt buộc)
          - platform: ios
            runner: macos-latest
          # Android chạy được trên Linux (nhanh + rẻ hơn)
          - platform: android
            runner: ubuntu-latest

    env:
      # ── App identity ────────────────────────────────────────────────────────
      APP_BUNDLE_ID: com.kscreens.app
      APP_NAME: K Screens
      APP_VERSION: "1.0.0"

      # ── mobile-ci config ────────────────────────────────────────────────────
      CAP_PLATFORMS: ${{ matrix.platform }}
      SKIP_FASTLANE: ${{ matrix.platform == 'android' && 'true' || 'false' }}

      # ── Google Play (chỉ dùng cho Android) ──────────────────────────────
      GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY_B64 }}

      # ── Apple / Fastlane (chỉ dùng cho iOS) ────────────────────────────────
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      # ── CI flags ────────────────────────────────────────────────────────────
      CI: "true"
      SKIP_ASC_SETUP: "false"
      SKIP_BUILD: "false"
      SKIP_UPLOAD: ${{ inputs.skip_upload || 'false' }}

    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # STEP 1: Checkout source
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 2: Setup Node.js + pnpm (cả iOS lẫn Android đều cần)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📦 Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 3: Install node dependencies
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📦 Install dependencies"
        run: pnpm install --no-frozen-lockfile

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 4: Setup Ruby + Bundler (chỉ iOS cần cho Fastlane)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "💎 Setup Ruby"
        if: matrix.platform == 'ios'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false   # mobile-ci tự quản lý Gemfile

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 5: Setup SSH cho Match repo (chỉ iOS, nếu có key)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🔑 Setup SSH for Match"
        if: matrix.platform == 'ios' && env.MATCH_SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 6: Setup Android SDK (chỉ Android)
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🤖 Setup Java"
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 7: Cài mobile-ci và thêm vào PATH
      # install.sh tự detect GITHUB_PATH và thêm vào
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🔧 Install mobile-ci"
        run: bash mobile-ci/install.sh

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 8: Chạy mobile-ci setup
      # Tự động: fix code → build web → add platform → cap sync → fastlane
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🚀 Run mobile-ci setup"
        run: mobile-ci setup

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 8.5: Commit generated files (android/, ios/, keystore, etc.)
      # Chỉ commit khi có file mới — lần sau sẽ skip tạo lại
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📝 Commit generated files"
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Thêm từng path riêng (tránh 1 path lỗi → fail hết)
          for path in \
            android/ \
            ios/ \
            capacitor.config.json \
            fastlane/ \
            Gemfile \
            Gemfile.lock \
            .env.fastlane.example; do
            if [ -e "$path" ]; then
              git add -f "$path"
              echo "  ✓ Staged: $path"
            else
              echo "  ✗ Skip (không tồn tại): $path"
            fi
          done

          # Debug: hiển thị những gì đã staged
          echo ""
          echo "── Staged files ──"
          git diff --cached --stat || true
          echo ""

          # Chỉ commit nếu có thay đổi
          if git diff --cached --quiet; then
            echo "✅ Không có file mới cần commit"
          else
            git commit -m "chore: auto-generate ${{ matrix.platform }} platform files [skip ci]"

            # Push với retry (2 matrix jobs có thể push cùng lúc)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "⏳ Push lần $i thất bại, retry sau 5s..."
              sleep 5
            done
            echo "✅ Đã commit và push generated files"
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 9: (iOS only) Chạy Fastlane CI pipeline
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🍎 Fastlane CI Pipeline"
        if: matrix.platform == 'ios' && env.ASC_KEY_ID != ''
        working-directory: ${{ github.workspace }}
        run: bundle exec fastlane ci_pipeline
        env:
          RELEASE_NOTES: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 10: (Android only) Build Release APK + AAB
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🤖 Build Android Release"
        if: matrix.platform == 'android'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 10.5: (Android only) Upload lên Google Play via Fastlane
      # ═══════════════════════════════════════════════════════════════════════
      - name: "🚀 Upload Google Play"
        if: matrix.platform == 'android' && env.GOOGLE_PLAY_JSON_KEY != '' && env.SKIP_UPLOAD != 'true'
        run: |
          # Decode JSON key từ base64
          echo "$GOOGLE_PLAY_JSON_KEY" | base64 --decode > /tmp/play-store-key.json

          # Cài fastlane nếu chưa có
          gem install fastlane --no-document || true

          # Upload AAB lên Google Play (internal track)
          fastlane supply \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --json_key /tmp/play-store-key.json \
            --package_name "$APP_BUNDLE_ID" \
            --track internal \
            --skip_upload_metadata \
            --skip_upload_changelogs \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_apk

          # Xóa key sau khi dùng
          rm -f /tmp/play-store-key.json
          echo "✅ Upload Google Play (internal) thành công!"

      # ═══════════════════════════════════════════════════════════════════════
      # STEP 11: Upload build artifacts
      # ═══════════════════════════════════════════════════════════════════════
      - name: "📤 Upload iOS IPA"
        if: matrix.platform == 'ios' && always()
        uses: actions/upload-artifact@v4
        with:
          name: K-Screens-iOS-${{ github.run_number }}
          path: build/App.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: "📤 Upload Android APK"
        if: matrix.platform == 'android' && always()
        uses: actions/upload-artifact@v4
        with:
          name: K-Screens-Android-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: "📤 Upload Android AAB"
        if: matrix.platform == 'android' && always()
        uses: actions/upload-artifact@v4
        with:
          name: K-Screens-Android-AAB-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
